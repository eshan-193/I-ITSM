spring.application.name=itsm

# ---------- Database (PostgreSQL). Override with env vars DB_URL / DB_USER / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/itsm}
spring.datasource.username=${DB_USER:itsm}
spring.datasource.password=${DB_PASSWORD:itsm}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate never alters tables.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- Web
server.port=${PORT:8080}
server.servlet.session.timeout=60m
spring.thymeleaf.cache=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**
management.endpoints.web.exposure.include=health,info

# ---------- Background jobs
spring.task.scheduling.pool.size=3
itsm.sla.monitor-interval-ms=30000

# ---------- AI (Google Gemini). Leave GEMINI_API_KEY unset to use the offline classifier only.
itsm.ai.gemini.api-key=${GEMINI_API_KEY:}
itsm.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
# tried in order when the main model is overloaded (common on the free tier)
itsm.ai.gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.1-flash-lite-preview,gemini-flash-latest}
itsm.ai.gemini.thinking-level=low
itsm.ai.gemini.timeout=15s
itsm.ai.gemini.total-timeout=20s
itsm.ai.gemini.cooldown=2m

# ---------- Email. Simulated (outbox only) unless MAIL_ENABLED=true and SPRING_MAIL_* are set, e.g. for Gmail:
#   SPRING_MAIL_HOST=smtp.gmail.com SPRING_MAIL_PORT=587 SPRING_MAIL_USERNAME=you@gmail.com
#   SPRING_MAIL_PASSWORD=<app password> SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true MAIL_ENABLED=true
itsm.mail.enabled=${MAIL_ENABLED:false}
itsm.mail.from=${MAIL_FROM:itsm@localhost}
itsm.base-url=${BASE_URL:http://localhost:8080}

# ---------- Demo data (creates users, services and history on first start with an empty database)
itsm.seed.enabled=${SEED_DATA:true}

logging.level.com.itsm=INFO
