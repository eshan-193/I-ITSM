<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('IT services')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container-fluid px-4 py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="page-title mb-0">IT services</h3>
        <a class="btn btn-outline-primary btn-sm" th:href="@{/admin/dependency-graph}"><i class="bi bi-diagram-3"></i> View dependency map</a>
    </div>
    <div class="row g-3">
        <div class="col-lg-8">
            <div class="accordion" id="svcList">
                <div class="accordion-item" th:each="s : ${services}">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" th:attr="data-bs-target='#svc' + ${s.id}">
                            <span class="me-2 fw-semibold" th:text="${s.name}"></span>
                            <span class="badge me-2" th:classappend="${s.criticality.name() == 'HIGH'} ? 'text-bg-danger' : (${s.criticality.name() == 'MEDIUM'} ? 'text-bg-warning' : 'text-bg-secondary')"
                                  th:text="${s.criticality} + ' criticality'"></span>
                            <span class="small text-muted" th:if="${!#sets.isEmpty(s.dependsOn)}">depends on
                                <span th:each="d, st : ${s.dependsOn}" th:text="${d.name} + (${st.last} ? '' : ', ')"></span></span>
                            <span class="badge text-bg-secondary ms-2" th:unless="${s.active}">inactive</span>
                        </button>
                    </h2>
                    <div class="accordion-collapse collapse" th:id="'svc' + ${s.id}" data-bs-parent="#svcList">
                        <form class="accordion-body small" th:action="@{/admin/services/{id}(id=${s.id})}" method="post">
                            <div class="row g-2">
                                <div class="col-md-6"><label class="form-label mb-0">Name</label><input class="form-control form-control-sm" name="name" th:value="${s.name}" required></div>
                                <div class="col-md-3"><label class="form-label mb-0">Business criticality</label>
                                    <select class="form-select form-select-sm" name="criticality"><option th:each="c : ${criticalities}" th:value="${c}" th:text="${c} + ' – ' + ${c.description}" th:selected="${c == s.criticality}"></option></select></div>
                                <div class="col-md-3"><label class="form-label mb-0">Default category</label>
                                    <select class="form-select form-select-sm" name="defaultCategoryId"><option value="">None</option>
                                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${s.defaultCategory != null and c.id == s.defaultCategory.id}"></option></select></div>
                                <div class="col-12"><label class="form-label mb-0">Description</label><input class="form-control form-control-sm" name="description" th:value="${s.description}"></div>
                                <div class="col-12"><label class="form-label mb-0">Depends on</label>
                                    <div class="d-flex flex-wrap gap-3">
                                        <div class="form-check" th:each="o : ${services}" th:if="${o.id != s.id}">
                                            <input class="form-check-input" type="checkbox" name="dependsOn" th:value="${o.id}" th:id="'d' + ${s.id} + '-' + ${o.id}" th:checked="${s.dependsOn(o)}">
                                            <label class="form-check-label" th:for="'d' + ${s.id} + '-' + ${o.id}" th:text="${o.name}"></label></div>
                                    </div></div>
                                <div class="col-12 d-flex justify-content-between align-items-center">
                                    <div class="form-check"><input class="form-check-input" type="checkbox" name="active" value="true" th:id="'a' + ${s.id}" th:checked="${s.active}">
                                        <label class="form-check-label" th:for="'a' + ${s.id}">Active</label></div>
                                    <button class="btn btn-primary btn-sm">Save</button></div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <form class="card card-body" th:action="@{/admin/services}" method="post">
                <h6>Add a service</h6>
                <label class="form-label small mb-0">Name</label><input class="form-control form-control-sm mb-2" name="name" required>
                <label class="form-label small mb-0">Description</label><input class="form-control form-control-sm mb-2" name="description">
                <label class="form-label small mb-0">Business criticality</label>
                <select class="form-select form-select-sm mb-2" name="criticality"><option th:each="c : ${criticalities}" th:value="${c}" th:text="${c} + ' – ' + ${c.description}"></option></select>
                <label class="form-label small mb-0">Default category</label>
                <select class="form-select form-select-sm mb-2" name="defaultCategoryId"><option value="">None</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select>
                <label class="form-label small mb-0">Depends on</label>
                <select class="form-select form-select-sm mb-3" name="dependsOn" multiple size="5">
                    <option th:each="o : ${services}" th:value="${o.id}" th:text="${o.name}"></option></select>
                <button class="btn btn-primary btn-sm">Add service</button>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
