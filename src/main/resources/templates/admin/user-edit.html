<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${user.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4" style="max-width: 980px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="text-muted small"><a th:href="@{/admin/users}">Users</a> / <span th:text="${user.name}"></span></div>
    <h3 class="page-title mb-3"><span th:text="${user.name}"></span> <span class="badge text-bg-light border fs-6" th:text="${user.role.label}"></span></h3>
    <div class="row g-3">
        <div class="col-md-6">
            <form class="card card-body" th:action="@{/admin/users/{id}(id=${user.id})}" method="post">
                <h6>Profile</h6>
                <label class="form-label small mb-0">Name</label><input class="form-control form-control-sm mb-2" name="name" th:value="${user.name}" required>
                <label class="form-label small mb-0">Email</label><input class="form-control form-control-sm mb-2" name="email" type="email" th:value="${user.email}" required>
                <label class="form-label small mb-0">Phone</label><input class="form-control form-control-sm mb-2" name="phone" th:value="${user.phone}">
                <th:block th:if="${user.role.name() != 'TECHNICIAN'}">
                    <label class="form-label small mb-0" th:text="${user.role.name() == 'EMPLOYEE'} ? 'Department' : 'Job title'"></label>
                    <input class="form-control form-control-sm mb-2" name="detail" th:value="${user.role.name() == 'EMPLOYEE'} ? ${user.department} : ${user.jobTitle}">
                </th:block>
                <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="active" value="true" id="active" th:checked="${user.active}">
                    <label class="form-check-label" for="active">Account active (can log in)</label></div>
                <button class="btn btn-primary btn-sm">Save profile</button>
            </form>
            <form class="card card-body mt-3" th:action="@{/admin/users/{id}/password(id=${user.id})}" method="post">
                <h6>Reset password</h6>
                <div class="input-group input-group-sm"><input class="form-control" type="password" name="password" minlength="8" required placeholder="New password">
                    <button class="btn btn-outline-danger">Reset</button></div>
            </form>
        </div>
        <div class="col-md-6" th:if="${technician != null}">
            <form class="card card-body" th:action="@{/admin/users/{id}/technician(id=${user.id})}" method="post">
                <h6>Technician profile <span class="small text-muted" th:text="'· ' + ${workload} + ' active now'"></span></h6>
                <label class="form-label small mb-1">Skills (used by skill-based and smart assignment)</label>
                <div class="row row-cols-2 mb-2">
                    <div class="col" th:each="c : ${categories}">
                        <div class="form-check"><input class="form-check-input" type="checkbox" name="skills" th:value="${c.id}" th:id="'sk' + ${c.id}"
                                                       th:checked="${technician.hasSkill(c)}">
                            <label class="form-check-label small" th:for="'sk' + ${c.id}" th:text="${c.name}"></label></div>
                    </div>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col"><label class="form-label small mb-0">Max active incidents</label>
                        <input class="form-control form-control-sm" type="number" min="1" max="50" name="maxActive" th:value="${technician.maxActiveIncidents}"></div>
                    <div class="col"><label class="form-label small mb-0">Years of experience</label>
                        <input class="form-control form-control-sm" type="number" min="0" name="experienceYears" th:value="${technician.experienceYears}"></div>
                </div>
                <div class="form-check"><input class="form-check-input" type="checkbox" name="available" value="true" id="avail" th:checked="${technician.available}">
                    <label class="form-check-label" for="avail">Available for new incidents</label></div>
                <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="teamLead" value="true" id="lead" th:checked="${technician.teamLead}">
                    <label class="form-check-label" for="lead">Team lead (first escalation level)</label></div>
                <button class="btn btn-primary btn-sm">Save technician profile</button>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
