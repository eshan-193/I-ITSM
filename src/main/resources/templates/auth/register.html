<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<div class="login-hero d-flex align-items-center justify-content-center p-3">
    <div class="w-100 login-card">
        <div class="text-center text-white mb-4">
            <h1 class="fw-bold"><i class="bi bi-shield-check"></i> I-ITSM</h1>
        </div>
        <div class="card p-4">
            <h5 class="mb-3">Create an employee account</h5>
            <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
                <div class="alert alert-danger py-2" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
                </div>
                <div class="mb-2">
                    <label class="form-label">Full name</label>
                    <input class="form-control" th:field="*{name}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="mb-2">
                    <label class="form-label">Work email</label>
                    <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="mb-2">
                    <label class="form-label">Department</label>
                    <input class="form-control" th:field="*{department}">
                </div>
                <div class="mb-2">
                    <label class="form-label">Password</label>
                    <input class="form-control" type="password" th:field="*{password}" th:errorclass="is-invalid">
                    <div class="form-text">At least 8 characters with letters and digits.</div>
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Repeat password</label>
                    <input class="form-control" type="password" th:field="*{confirmPassword}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>
                <button class="btn btn-primary w-100">Create account</button>
            </form>
            <p class="mt-3 mb-0 text-center small"><a th:href="@{/login}">Back to login</a></p>
        </div>
    </div>
</div>
</body>
</html>
