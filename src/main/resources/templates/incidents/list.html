<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Incidents')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container-fluid px-4 py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="page-title mb-0">Search incidents</h3>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/incidents/export.csv(number=${criteria.number},keyword=${criteria.keyword},status=${criteria.status},priority=${criteria.priority},categoryId=${criteria.categoryId},serviceId=${criteria.serviceId},technicianId=${criteria.technicianId},slaStatus=${criteria.slaStatus},from=${criteria.from},to=${criteria.to},openOnly=${criteria.openOnly})}">
            <i class="bi bi-download"></i> Export CSV</a>
    </div>

    <form class="card card-body mb-3" th:action="@{/incidents}" th:object="${criteria}" method="get">
        <div class="row g-2">
            <div class="col-md-2"><label class="form-label small">Incident ID</label>
                <input class="form-control form-control-sm" th:field="*{number}" placeholder="INC1001"></div>
            <div class="col-md-3"><label class="form-label small">Keyword</label>
                <input class="form-control form-control-sm" th:field="*{keyword}" placeholder="title or description"></div>
            <div class="col-md-2"><label class="form-label small">Status</label>
                <select class="form-select form-select-sm" th:field="*{status}">
                    <option value="">Any</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"></option></select></div>
            <div class="col-md-1"><label class="form-label small">Priority</label>
                <select class="form-select form-select-sm" th:field="*{priority}">
                    <option value="">Any</option>
                    <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option></select></div>
            <div class="col-md-2"><label class="form-label small">Category</label>
                <select class="form-select form-select-sm" th:field="*{categoryId}">
                    <option value="">Any</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></div>
            <div class="col-md-2"><label class="form-label small">Service</label>
                <select class="form-select form-select-sm" th:field="*{serviceId}">
                    <option value="">Any</option>
                    <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name}"></option></select></div>
            <div class="col-md-2" th:if="${me.role.name() != 'EMPLOYEE'}"><label class="form-label small">Technician</label>
                <select class="form-select form-select-sm" th:field="*{technicianId}">
                    <option value="">Any</option>
                    <option value="-1">Unassigned</option>
                    <option th:each="t : ${technicians}" th:value="${t.id}" th:text="${t.name}"></option></select></div>
            <div class="col-md-2"><label class="form-label small">SLA status</label>
                <select class="form-select form-select-sm" th:field="*{slaStatus}">
                    <option value="">Any</option>
                    <option th:each="s : ${slaStatuses}" th:value="${s}" th:text="${s.label}"></option></select></div>
            <div class="col-md-2"><label class="form-label small">Created from</label>
                <input type="date" class="form-control form-control-sm" th:field="*{from}"></div>
            <div class="col-md-2"><label class="form-label small">Created to</label>
                <input type="date" class="form-control form-control-sm" th:field="*{to}"></div>
            <div class="col-md-2 d-flex align-items-end">
                <div class="form-check"><input class="form-check-input" type="checkbox" th:field="*{openOnly}" id="openOnly">
                    <label class="form-check-label small" for="openOnly">Open only</label></div></div>
            <div class="col-md-2 d-flex align-items-end gap-2">
                <button class="btn btn-sm btn-primary"><i class="bi bi-search"></i> Search</button>
                <a class="btn btn-sm btn-link" th:href="@{/incidents}">Reset</a></div>
        </div>
    </form>

    <div class="card">
        <div class="card-header"><span th:text="${#lists.size(results)}">0</span> incidents</div>
        <div class="table-responsive">
            <table class="table table-hover table-sm mb-0">
                <thead><tr><th class="ps-3">Incident</th><th>Service / category</th><th>Priority</th><th>Status</th><th>Technician</th><th>SLA</th><th>Risk</th><th>Created</th></tr></thead>
                <tbody>
                <tr th:each="i : ${results}">
                    <td class="ps-3"><a class="incident-link" th:href="@{/incidents/{id}(id=${i.id})}" th:text="${i.number}"></a>
                        <div class="small text-muted text-truncate" style="max-width: 360px" th:text="${i.title}"></div></td>
                    <td><div th:text="${i.service.name}"></div><div class="small text-muted" th:text="${i.category?.name}"></div></td>
                    <td><span th:replace="~{fragments/badges :: priority(${i.priority})}"></span></td>
                    <td><span th:replace="~{fragments/badges :: status(${i.status})}"></span>
                        <span class="badge text-bg-danger" th:if="${i.escalationLevel > 0}" title="Escalated"><i class="bi bi-arrow-up"></i></span></td>
                    <td th:text="${i.assignee?.name} ?: '—'"></td>
                    <td><span th:replace="~{fragments/badges :: sla(${i})}"></span></td>
                    <td><span th:replace="~{fragments/badges :: risk(${risk[i.id]})}"></span></td>
                    <td class="small text-muted" th:text="${@fmt.shortDate(i.createdAt)}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(results)}"><td colspan="8" class="text-center text-muted py-4">No incidents match these filters.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
