<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4" style="max-width: 860px">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="page-title mb-0">Notifications</h3>
        <form th:action="@{/notifications/read-all}" method="post"><button class="btn btn-sm btn-outline-secondary">Mark all as read</button></form>
    </div>
    <div class="list-group">
        <a class="list-group-item list-group-item-action d-flex gap-3" th:each="n : ${notifications}"
           th:href="@{/notifications/{id}/open(id=${n.id})}" th:classappend="${!n.read} ? 'fw-semibold' : 'text-muted'">
            <i class="bi bi-circle-fill" style="font-size:.6rem; margin-top:.45rem" th:classappend="'text-' + ${n.severity.color}"></i>
            <div class="flex-grow-1"><div th:text="${n.message}"></div>
                <small class="text-muted fw-normal" th:text="${@fmt.ago(n.createdAt)}"></small></div>
        </a>
        <div class="list-group-item text-muted" th:if="${#lists.isEmpty(notifications)}">You have no notifications.</div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
