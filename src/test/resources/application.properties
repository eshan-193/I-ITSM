# Tests run against an in-memory H2 database in PostgreSQL mode, so no database server is needed.
spring.datasource.url=jdbc:h2:mem:itsm-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
itsm.seed.enabled=true
itsm.sla.monitor-interval-ms=3600000
itsm.ai.gemini.api-key=
logging.level.com.itsm=WARN
